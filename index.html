    <style>
        :root {
            --ak-ink: #14432C;
            --ak-green: #1E7A4B;
            --ak-green-dark: #14603A;
            --ak-leaf: #6BBF59;
            --ak-gold: #F0B429;
            --ak-orange: #EE7B1C;
            --ak-cream: #FFF8EC;
            --ak-sand: #FDF1DC;
            --ak-text: #3F5147;
            --ak-border: rgba(20, 67, 44, 0.12);
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Rubik', system-ui, sans-serif;
            background-color: var(--ak-cream);
            color: var(--ak-text);
            -webkit-font-smoothing: antialiased;
        }

        /* Badge de section */
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 999px;
            background: #fff;
            border: 2px solid var(--ak-border);
            color: var(--ak-green);
        }

        /* Bouton façon Duolingo : il s'enfonce au clic */
        .btn-press {
            transition: all 0.1s;
            border-bottom-width: 4px;
            border-bottom-style: solid;
        }

        .btn-press:active {
            border-bottom-width: 0;
            transform: translateY(4px);
        }

        /* Carte : bordure franche + ombre portée dure, jamais de flou timide */
        .ak-card {
            background: #fff;
            border: 2px solid var(--ak-border);
            border-radius: 24px;
            transition: transform 200ms ease, box-shadow 200ms ease;
        }

        .ak-card-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 -4px rgba(20, 67, 44, 0.10);
        }

        .ak-input {
            width: 100%;
            background: #fff;
            border: 2px solid var(--ak-border);
            color: var(--ak-ink);
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 15px;
            font-family: 'Rubik', sans-serif;
            transition: border-color 150ms ease;
        }

        .ak-input::placeholder { color: rgba(63, 81, 71, 0.42); }

        .ak-input:focus {
            outline: none;
            border-color: var(--ak-green);
        }

        /* Pointillés du fond, discrets */
        .ak-dots {
            background-image: radial-gradient(circle at 1px 1px, rgba(240, 180, 41, 0.30) 1.5px, transparent 0);
            background-size: 24px 24px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(30, 122, 75, 0.35); border-radius: 10px; }
        ::selection { background: rgba(240, 180, 41, 0.35); color: var(--ak-ink); }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
            html { scroll-behavior: auto; }
        }
    </style>
